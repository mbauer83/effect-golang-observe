name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # One checkout. go.mod requires the runtime by version, so this job
      # resolves it the way anyone depending on this module does -- which is
      # the point of running it: a green run says the published dependency is
      # enough to build and test this commit.
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -count=1 defeats the test result cache, so a green run always reflects
      # the commit it ran on. -coverpkg is needed because the suites live
      # outside the packages they exercise.
      - name: Test
        run: go test -count=1 -coverpkg=./... ./...

      # An observer is called from every fiber a program forks, and a buffering
      # one delivers from a goroutine of its own, so this is the suite that
      # matters most here.
      - name: Race
        run: go test -race -count=1 ./...

      # Every Gen body rewritten into a FlatMap chain must behave exactly as
      # written, so the suites run again on the rewritten source.
      - name: Race, rewritten
        run: go tool effectgo test -race -count=1 ./...

      # The example must remain a runnable program, not only a test fixture.
      - name: Examples
        run: go run ./examples/cmd/observedemo
